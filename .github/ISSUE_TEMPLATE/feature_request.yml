name: Solicitud de funcionalidad
description: Propón una funcionalidad o mejora para FireWatch y el problema que resuelve.
title: "[Funcionalidad]: "
labels:
  - "type:feature"
body:
  - type: markdown
    attributes:
      value: |
        ## Antes de abrir este issue

        - **Busca un issue existente.** Revisa los issues abiertos y cerrados antes de escribir. Si la propuesta ya está discutida, comenta en ese issue en lugar de abrir uno nuevo.
        - **Primero el problema, después la propuesta.** Explica qué falta o qué resulta incómodo antes de describir la solución; así la revisión puede evaluar el caso y no solo la implementación.
        - **La aprobación se revisa, no se declara.** Un mantenedor revisa la propuesta y aplica `status:approved` cuando queda clara y acotada. Este issue nace sin esa etiqueta.
        - **El PR llega después.** Según `odd/PR-CONVENTIONS.md`, el PR que implemente este issue debe enlazarlo y el issue debe llevar `status:approved` antes de abrir el PR.
        - **Esta plantilla no automatiza nada.** No busca duplicados, no aplica etiquetas de estado ni impide crear el issue; solo deja el flujo escrito.

        No publiques credenciales, datos personales ni rutas internas.
  - type: dropdown
    id: area
    attributes:
      label: Área relacionada
      description: ¿Dónde debería vivir la mejora?
      options:
        - Frontend
        - API
        - Datos o modelo
        - Despliegue
        - Documentación
        - Otro
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: Problema u oportunidad
      description: ¿Qué falta o qué resulta incómodo hoy? Describe la situación y a quién afecta.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: ¿Qué debería hacer FireWatch? Si hay más de una forma, describe la que prefieres.
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
      description: ¿Qué otras opciones evaluaste y por qué las descartaste? Si no evaluaste ninguna, dilo.
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: "Opcional: enlaces, ejemplos de uso o cualquier detalle que ayude a evaluar la propuesta."
    validations:
      required: false
