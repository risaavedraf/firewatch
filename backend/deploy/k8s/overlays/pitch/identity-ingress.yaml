# The login half of the public edge. Only the `firewatch` realm and the theme
# resources its login page loads are routed: the admin console and the
# `master` realm have no path here, so they stay reachable only from inside
# the cluster (provision-realm.py uses a port-forward).
#
# The hop to Keycloak is HTTPS and verified, the same way base/ingress.yaml
# verifies the gateway: `keycloak-tls` carries the SAN `identity`, and
# `gateway-upstream-ca` holds the internal CA that signed it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: 'HTTPS'
    nginx.ingress.kubernetes.io/proxy-ssl-verify: 'on'
    nginx.ingress.kubernetes.io/proxy-ssl-name: identity
    nginx.ingress.kubernetes.io/proxy-ssl-secret: firewatch/gateway-upstream-ca
    # Keycloak's responses carry large Set-Cookie headers; NGINX's default
    # buffer answers them with "upstream sent too big header" and a 502.
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
spec:
  ingressClassName: nginx
  rules:
    - host: PITCH_AUTH_HOST
      http:
        paths:
          - path: /realms/firewatch/
            pathType: Prefix
            backend:
              service:
                name: identity
                port: {number: 8443}
          - path: /resources/
            pathType: Prefix
            backend:
              service:
                name: identity
                port: {number: 8443}
