# FireWatch login theme: the Keycloak pages for sign-in and sign-up, dressed in
# the same aerial night palette as the FireWatch page so leaving for the identity
# provider and coming back does not feel like changing product.
#
# It extends `keycloak.v2`, the default login theme of the pinned Keycloak
# (26.5.7), and changes only presentation and copy: no template is overridden,
# so every flow Keycloak ships (login, registration, required actions, errors,
# OTP, update password) keeps working exactly as upstream and picks up upstream
# fixes on a version bump. Resources not found here are served from the parent.
parent=keycloak.v2
import=common/keycloak

# The parent's stylesheet first, then ours on top of it.
styles=css/styles.css css/firewatch.css

# The skin is unconditionally the aerial night palette, and it declares
# `color-scheme: dark` itself. The parent's OS-driven dark variant would add a
# second, conflicting token set when the operating system prefers dark, so it
# stays off: light and dark preferences render the same deliberate surface.
darkMode=false

locales=es,en
